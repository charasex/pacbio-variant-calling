samples: "config/samples.tsv"
datadir: "/home/ichninak/work/data/"
primary_haplotype: "hap1"


# Paramètres Minimap2 (ex. map-hifi pour PacBio HiFi, map-ont pour Oxford Nanopore)
minimap_ax: "map-hifi"
seed: 42

# QC and Mosdepth parameters
mosdepth_windows_size: 10000

# setting for bcftools mpileup
minMQ: 2 # Minimum mapping quality for an alignment to be used [0]
minBQ: 13 # Minimum base quality for a base to be considered [13]
# for different tools of assembly choose the correct one
configTools: "pacbio-ccs-1.20" # use "illumina" if its illumina, or "ultima", or "ont-sup"

